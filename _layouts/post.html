---
layout: default
---
<article class="post">
  <p class="meta mono">{{ page.date | date: "%d %B %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="content">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; All posts</a></p>
</article>
