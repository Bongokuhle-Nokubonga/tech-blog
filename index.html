---
layout: default
title: Posts
---
<section class="intro">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <p class="meta mono">{{ post.date | date: "%d %b %Y" }}</p>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p>{{ post.excerpt | strip_html | truncatewords: 32 }}</p>
  </li>
  {% endfor %}
</ul>
